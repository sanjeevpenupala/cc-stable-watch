name: pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r public/. _site/
          mkdir -p _site/data
          cp data/stable.json data/latest.json data/releases.json _site/data/
          # Pages serves every file with max-age=600. Version the script and
          # stylesheet URLs per commit so a fresh index.html never pairs with
          # a cached app.js or styles.css from the previous deploy.
          v="${GITHUB_SHA::7}"
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$v\"|; s|href=\"styles.css\"|href=\"styles.css?v=$v\"|" _site/index.html
          grep -q "app.js?v=$v" _site/index.html && grep -q "styles.css?v=$v" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
